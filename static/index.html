<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="color-scheme" content="light dark">
<title>书中有音</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="static/style.css?v=20261109e">
<link rel="stylesheet" href="static/app.css?v=20261109e">
</head>
<body>

<!-- ---------- 启动占位 ---------- -->
<div id="boot" class="boot">
  <div class="boot-mark">书</div>
  <p>正在连接书库…</p>
</div>

<!-- ---------- 登录 ---------- -->
<div id="login" class="login-shell hidden">
  <section class="login-visual">
    <div class="brand-row">
      <div class="mark">书</div>
      <div>
        <div class="brand-name">书中有音</div>
        <span class="brand-sub">SHU ZHONG YOU YIN</span>
      </div>
    </div>
    <div class="quote">
      把书里的字，<br>听成耳边的声音。
      <span>深夜、通勤、散步，随时续上上次的那一章</span>
    </div>
    <div class="visual-foot">本地书库 · 多账号 · 背景音乐 · 离线缓存</div>
  </section>
  <section class="login-form-wrap">
    <div class="login-card">
      <div class="eyebrow">欢迎回来</div>
      <h1>登录你的书库</h1>
      <p class="sub">登录后可同步书架、书单、收藏与播放进度。</p>
      <form id="login-form" autocomplete="on">
        <div class="input-group">
          <label for="login-user">账号</label>
          <input id="login-user" name="username" type="text" autocomplete="username" placeholder="账号或飞牛用户名" required>
        </div>
        <div class="input-group">
          <label for="login-pass">密码</label>
          <input id="login-pass" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <div id="login-error" class="login-error hidden"></div>
        <button id="login-go" class="btn btn-primary" type="submit">登录</button>
      </form>
      <div class="login-foot">
        <span>首次使用默认 admin / admin123</span>
        <button id="conn-toggle" class="link" type="button">连接设置</button>
      </div>
      <div id="conn-box" class="server-setup">
        <div class="form-row">
          <div>
            <div class="label">当前访问地址</div>
            <div class="hint">服务端按相对路径解析，无需手动填写</div>
          </div>
          <code id="conn-current" class="mono">—</code>
        </div>
        <div class="form-row">
          <div>
            <div class="label">可用线路</div>
            <div class="hint">局域网、飞牛网关前缀、远程域名都可直接打开本页</div>
          </div>
          <div id="conn-lines" class="conn-lines">检测中…</div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ---------- 主壳 ---------- -->
<div id="app" class="shell hidden">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">书</div>
      <div>
        <div class="brand-name">书中有音</div>
        <span class="brand-sub">SHU ZHONG YOU YIN</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">书库</div>
      <a class="nav-item" href="#/home" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9.5 20.5v-6h5v6"/></svg>
        <span>首页</span>
      </a>
      <a class="nav-item" href="#/library" data-nav="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="16" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="16" rx="1.6"/></svg>
        <span>书库</span>
      </a>
      <a class="nav-item" href="#/playlists" data-nav="playlists">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6h14M5 12h10M5 18h7"/><circle cx="18" cy="16.5" r="2.4"/><path d="M20.4 16.5V9"/></svg>
        <span>书单</span>
      </a>
      <a class="nav-item" href="#/favorites" data-nav="favorites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4.6l2.5 5 5.5.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.5-.8z"/></svg>
        <span>收藏</span>
      </a>
      <a class="nav-item" href="#/mine" data-nav="mine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.6-4 3.7-6 7.5-6s6.9 2 7.5 6"/></svg>
        <span>我的</span>
      </a>
    </nav>
    <div class="rail-foot">
      <button id="theme-btn" class="nav-item theme-btn" type="button" title="切换深浅色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        <span id="theme-label">浅色</span>
      </button>
      <div class="profile-mini">
        <img id="rail-avatar" class="avatar" alt="">
        <div>
          <div id="rail-name" class="name">—</div>
          <div id="rail-role" class="meta">—</div>
        </div>
        <button id="logout-btn" class="icon-btn tiny" type="button" title="退出登录" aria-label="退出登录">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/><path d="M10 12h10M17 9l3 3-3 3"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.2 4.2"/></svg>
        <input id="search" type="search" placeholder="搜索书名、作者或章节" autocomplete="off" aria-label="搜索">
      </div>
      <div class="top-actions">
        <button id="btn-connect" class="icon-btn" title="连接与扫码" aria-label="连接与扫码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><path d="M14 14h2.6v2.6H14zM18.4 14H20v2.6M14 18.4h2.6V20M18.4 18.4H20V20"/></svg>
        </button>
        <button id="btn-rescan" class="icon-btn" title="重新扫描书库" aria-label="重新扫描书库">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>
        </button>
      </div>
    </div>

    <div id="scan-note" class="scan-note hidden">
      <span class="spinner"></span>
      <span id="scan-text">正在扫描书库…</span>
    </div>

    <div id="view"></div>
  </main>
</div>

<!-- ---------- 迷你播放条 ---------- -->
<div id="mini" class="mini hidden">
  <div class="mini-bar"><span id="mini-progress"></span></div>
  <img id="mini-cover" class="mini-cover" alt="">
  <div class="mini-info">
    <div id="mini-title" class="mini-title">—</div>
    <div id="mini-chapter" class="mini-chapter">—</div>
  </div>
  <button id="mini-play" class="icon-btn small" aria-label="播放或暂停">
    <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5l11 6.5-11 6.5z"/></svg>
    <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="7.5" y="5.5" width="3.2" height="13" rx="1.2"/><rect x="13.3" y="5.5" width="3.2" height="13" rx="1.2"/></svg>
  </button>
  <button id="mini-next" class="icon-btn small" aria-label="下一章">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 6v12M5 7l8 5-8 5z"/></svg>
  </button>
  <button id="mini-open" class="icon-btn small" aria-label="打开播放页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5-6 5 6"/></svg>
  </button>
</div>

<!-- ---------- 通用抽屉 / 弹层 ---------- -->
<div id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-mask" data-close="drawer"></div>
  <section class="drawer-panel">
    <button class="icon-btn tiny drawer-close" data-close="drawer" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="drawer-body"></div>
  </section>
</div>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-mask" data-close="modal"></div>
  <section class="modal-panel">
    <div class="panel-head">
      <h2 id="modal-title">—</h2>
      <button class="icon-btn tiny" data-close="modal" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="modal-body"></div>
  </section>
</div>

<div id="toast" class="toast"></div>

<audio id="audio" preload="metadata"></audio>
<audio id="bgm-audio" preload="none" loop></audio>
<script src="static/vendor/qrcode.min.js"></script>
<script src="static/app.js?v=20261109e"></script>
</body>
</html>
